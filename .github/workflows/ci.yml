name: CI - Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Job 1: Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint --if-present

      - name: 🏗️ Build TypeScript
        run: npm run build

      - name: ✅ Run tests
        run: npm test --if-present

      - name: 📊 Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist
          retention-days: 7

  # Job 2: Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint code
        run: npm run lint --if-present

      - name: 🏗️ Build application
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_TITLE: MAEXTRIA - Plataforma de Cursos Online
          VITE_SUPABASE_URL: https://zcrwmdctwjqrvzbvfpuj.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mQQbxvu4RiNr6S_Qv03r7g_wnc6k_Cm

      - name: ✅ Run tests
        run: npm test --if-present

      - name: 📊 Upload build artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # Job 3: Security Audit (Non-blocking - warnings only)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true  # Não bloqueia o pipeline

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: 🔒 Audit backend dependencies
        continue-on-error: true
        run: |
          cd backend
          npm audit --audit-level=critical || echo "⚠️ Vulnerabilidades encontradas (não bloqueante)"

      - name: 🔒 Audit frontend dependencies
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=critical || echo "⚠️ Vulnerabilidades encontradas (não bloqueante)"

  # Job 4: Code Quality Check
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check for .env files
        run: |
          # Ignora .env.example e .env.local (que deve estar no .gitignore)
          if find . -name ".env" -not -name ".env.example" -not -name ".env.local" -not -path "*/node_modules/*" -type f | grep -q .; then
            echo "⚠️ Warning: .env files found (verifique se estão no .gitignore)"
            find . -name ".env" -not -name ".env.example" -not -name ".env.local" -not -path "*/node_modules/*" -type f
          else
            echo "✅ No .env files found - Good!"
          fi

      - name: 📝 Check for TODO comments (informativo)
        continue-on-error: true
        run: |
          echo "🔍 Checking for TODO/FIXME comments (informativo, não bloqueia)..."
          count=$(grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules . | wc -l || echo "0")
          echo "📊 TODOs encontrados: $count"
          if [ "$count" -gt "0" ]; then
            grep -r "TODO\|FIXME" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" --exclude-dir=node_modules . | head -20
          fi

  # Summary Job
  ci-success:
    name: ✅ CI Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, security-audit, code-quality]
    if: always()

    steps:
      - name: Check CI status
        run: |
          # Backend e Frontend são obrigatórios
          # Security-audit e code-quality são informativos (não bloqueiam)
          if [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "❌ CI Failed - Build obrigatório falhou"
            exit 1
          else
            echo "✅ Build passou!"
            if [ "${{ needs.security-audit.result }}" != "success" ]; then
              echo "⚠️ Security audit teve warnings (não bloqueante)"
            fi
            if [ "${{ needs.code-quality.result }}" != "success" ]; then
              echo "⚠️ Code quality teve warnings (não bloqueante)"
            fi
            echo "✅ CI concluído com sucesso!"
          fi
