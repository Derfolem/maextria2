<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Teste Supabase – MAEXTRIA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0a0a1a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .card {
        background: #11132a;
        border: 1px solid #2a2c50;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        width: 90%;
        max-width: 480px;
      }
      input, button {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        border: none;
        font-size: 16px;
      }
      input { background: #0a0a1a; color: #fff; border: 1px solid #2a2c50; }
      button { background: #6b4eff; color: #fff; cursor: pointer; }
      pre { background: #090a16; padding: 12px; border-radius: 8px; text-align: left; overflow-x: auto; color: #9ff; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Teste de Conexão Supabase</h2>
      <p>Informe sua URL e chave pública (anon key):</p>
      <input id="url" placeholder="https://seuprojeto.supabase.co" />
      <input id="key" placeholder="eyJhbGciOi..." />
      <button id="testar">🔍 Testar Conexão</button>
      <div id="resultado" style="margin-top: 16px"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.4/dist/umd/supabase.min.js"></script>

          const key = document.getElementById('key').value.trim();

            out.innerHTML = "<pre>⚠️ Informe a URL e a chave pública (anon key).</pre>";
            return;
          }
