<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Teste de Conexão Supabase – MAEXTRIA</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0a0a1a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        text-align: center;
      }
      .card {
        background: #11132a;
        border: 1px solid #2a2c50;
        border-radius: 12px;
        padding: 32px;
        max-width: 480px;
      }
      button {
        background: #6b4eff;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 16px;
      }
      pre {
        background: #090a16;
        padding: 16px;
        border-radius: 8px;
        color: #9ff;
        overflow-x: auto;
        text-align: left;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Teste de Conexão Supabase</h2>
      <p>Informe os dados do seu projeto e clique em testar.</p>
      <input
        id="url"
        placeholder="https://seuprojeto.supabase.co"
        style="width:90%;margin:4px;padding:8px;border-radius:4px;border:none"
      /><br />
      <input
        id="key"
        placeholder="chave anon pública (eyJhb...)"
        style="width:90%;margin:4px;padding:8px;border-radius:4px;border:none"
      /><br />
      <button id="testar">🔍 Testar Conexão</button>
      <div id="resultado" style="margin-top:16px"></div>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
      const testBtn = document.getElementById("testar");
      testBtn.addEventListener("click", async () => {
        const url = document.getElementById("url").value.trim();
        const key = document.getElementById("key").value.trim();
        const out = document.getElementById("resultado");

        if (!url || !key) {
          out.innerHTML = "<pre>⚠️ Informe a URL e a chave pública do Supabase.</pre>";
          return;
        }

        out.innerHTML = "⏳ Testando conexão...";
        try {
          const s = window.supabase.createClient(url, key);
          const { data, error } = await s.from("usuarios").select("*").limit(1);
          if (error) {
            out.innerHTML = `<pre>❌ Erro Supabase:\n
